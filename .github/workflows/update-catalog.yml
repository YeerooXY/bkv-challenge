name: Update catalog

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gtfs-realtime-bindings
      - name: Merge the live feed into the catalog
        env:
          BKK_API_KEY: ${{ secrets.BKK_API_KEY }}
        run: python tools/update_catalog.py
      - name: Commit changes
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/catalog.json data/routes.json
          git diff --cached --quiet || git commit -m "Update catalog" && git push
