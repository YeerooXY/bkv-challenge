name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "capacitor.config.json"
      - "package.json"
      - "tools/prepare_www.py"
      - "tools/android_setup.py"
      - "tools/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: npm install

      - name: Generate the Android project
        run: |
          python tools/prepare_www.py
          npx cap add android
          python tools/android_setup.py "${{ github.run_number }}" "1.${{ github.run_number }}"
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            # No release key stored yet: sign with a throwaway key. Such a build cannot update an installed app.
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias bkv -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=throwaway"
            echo "SIGNED=throwaway" >> "$GITHUB_ENV"
          fi
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KEYSTORE_PASSWORD" "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias bkv \
            --ks-pass env:KS_PASS --out BKV-Challenge.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs BKV-Challenge.apk | head -3

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          if [ "$SIGNED" = "release" ]; then
            gh release create "$TAG" BKV-Challenge.apk --title "BKV Challenge $TAG" --latest \
              --notes "Install on Android: open BKV-Challenge.apk and allow installs from this source. Updates install over the existing app."
          else
            gh release create "$TAG" BKV-Challenge.apk --title "BKV Challenge $TAG (test build)" --prerelease \
              --notes "Test build with a throwaway signing key. It cannot be updated in place: uninstall it before installing a release build."
          fi
